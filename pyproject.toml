[project]
name = "unga81"
version = "0.1.0"
authors = [{ name = "Diego Arenas", email = "darenasc@gmail.com" }]
maintainers = [{ name = "Diego Arenas", email = "darenasc@gmail.com" }]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "folium>=0.20.0",
  "loguru>=0.7.3",
  "lonboard>=0.16.0",
  "lxml>=6.1.3",
  "mapclassify>=2.11.0",
  "maplibre[all]>=0.3.6",
  "matplotlib>=3.11.2",
  "ollama>=0.6.2",
  "pandas>=2.1.4,<3.0.0",
  "pendulum>=3.2.0",
  "plotly>=7.1.0",
  "python-dotenv>=1.2.3",
  "requests>=2.34.2",
  "streamlit>=1.64.0",
  "streamlit-folium>=0.27.4",
  "tqdm>=4.70.1",
  "typer>=0.27.2",
  "xmltodict>=1.0.4",
  "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
  "black>=26.5.1",
  "flake8>=7.3.0",
  "ipykernel>=7.3.0",
  "isort>=9.0.1",
  "jupyter>=1.1.1",
  "mlflow>=3.16.1",
  "mypy>=2.3.1",
]
[project.urls]
Homepage = "https://github.com/darenasc/unga81"
Issues = "https://github.com/darenasc/unga81/issues"

[project.scripts]
unga81 = 'unga81.main:app'

[tool.mypy]
ignore_missing_imports = true

[tool.isort]
profile = "black"

[tool.pylint."MESSAGES CONTROL"]
disable = '''print-statement,
        parameter-unpacking,
        unpacking-in-except,
        old-raise-syntax,
        backtick,
        long-suffix,
        old-ne-operator,
        old-octal-literal,
        import-star-module-level,
        non-ascii-bytes-literal,
        raw-checker-failed,
        bad-inline-option,
        locally-disabled,
        file-ignored,
        suppressed-message,
        useless-suppression,
        deprecated-pragma,
        use-symbolic-message-instead,
        apply-builtin,
        basestring-builtin,
        buffer-builtin,
        cmp-builtin,
        coerce-builtin,
        execfile-builtin,
        file-builtin,
        long-builtin,
        raw_input-builtin,
        reduce-builtin,
        standarderror-builtin,
        unicode-builtin,
        xrange-builtin,
        coerce-method,
        delslice-method,
        getslice-method,
        setslice-method,
        no-absolute-import,
        old-division,
        dict-iter-method,
        dict-view-method,
        next-method-called,
        metaclass-assignment,
        indexing-exception,
        raising-string,
        reload-builtin,
        oct-method,
        hex-method,
        nonzero-method,
        cmp-method,
        input-builtin,
        round-builtin,
        intern-builtin,
        unichr-builtin,
        map-builtin-not-iterating,
        zip-builtin-not-iterating,
        range-builtin-not-iterating,
        filter-builtin-not-iterating,
        using-cmp-argument,
        eq-without-hash,
        div-method,
        idiv-method,
        rdiv-method,
        exception-message-attribute,
        invalid-str-codec,
        sys-max-int,
        bad-python3-import,
        deprecated-string-function,
        deprecated-str-translate-call,
        deprecated-itertools-function,
        deprecated-types-field,
        next-method-defined,
        dict-items-not-iterating,
        dict-keys-not-iterating,
        dict-values-not-iterating,
        deprecated-operator-function,
        deprecated-urllib-function,
        xreadlines-attribute,
        deprecated-sys-function,
        exception-escape,
        comprehension-escape,
        missing-module-docstring,
        missing-class-docstring,
        missing-function-docstring,
        W,
        R0201,
        print-statement,
        import-outside-toplevel,
        import-error,
'''

[tool.uv.workspace]
members = ["llm_extraction"]
